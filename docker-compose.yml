# docker compose up --build
# 처음 한 번은 베이스라인 모델 다운로드(약 2GB)와 파인튜닝 모델 등록 때문에 몇 분 걸린다.
# 준비물: models/ 에 Qwen2.5-Coder-3B-Instruct.Q4_K_M.gguf 와 Modelfile (README 3번 참고)

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # 켜질 때는 2초마다 빨리 확인하고, 준비된 뒤에는 30초마다만 확인한다 (로그가 너무 많이 쌓이지 않게)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 5

  # 모델 준비: 베이스라인 pull + 파인튜닝 GGUF 등록 (이미 있으면 빠르게 끝남)
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    volumes:
      - ./models:/models:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull qwen2.5-coder:3b
        cd /models && ollama create text2sql-ft -f Modelfile
        # v2 GGUF가 있으면 함께 등록 (없으면 화면에서 v2 선택지가 비활성화됨)
        if ls /models/v2/*.gguf >/dev/null 2>&1; then
          cd /models/v2 && ollama create text2sql-ft-v2 -f Modelfile
        fi

  app:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      # Spider DB는 있으면 함께 쓴다 (없으면 한국어 쇼핑몰 DB만 보임)
      - ./data/spider:/app/data/spider:ro
    ports:
      - "8000:8000"

volumes:
  ollama:
